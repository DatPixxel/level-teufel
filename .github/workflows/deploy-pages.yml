# Stellt das Spiel automatisch auf GitHub Pages bereit.
# Aktiviert Pages beim ersten Lauf selbst (enablement: true).
name: Spiel auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main, claude/level-devil-mobile-game-4fd0jn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
      - name: Pages konfigurieren (und ggf. aktivieren)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Spiel-Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Auf Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
